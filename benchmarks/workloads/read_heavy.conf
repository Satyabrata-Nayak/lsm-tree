# Read-heavy workload: preloads part of the key space, then mostly reads.
# The preload writes are not measured; they build the SSTable layout that the
# measured reads then exercise (including Bloom-filter negative lookups).
workload = read_heavy
ops = 20000
write_ratio = 0.1
key_space = 100000
value_size = 100
preload = 10000
seed = 20260728
